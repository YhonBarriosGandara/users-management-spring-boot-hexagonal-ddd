name: Spring Boot CI - Build, Test & Docker Check

on:
  push:
    branches: [ "main", "feat/**", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Maven Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar Pruebas Automatizadas con Maven
        run: |
          chmod +x mvnw
          ./mvnw clean test --batch-mode --no-transfer-progress

  docker-build-test:
    name: Docker Multi-Stage Image Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: users-management-api:ci-test
